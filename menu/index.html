    inset: 0;

    margin-inline: auto;
    pointer-events: none;

  .velzo-startup__placeholder {
    border-radius: 10px;

  }

  .velzo-startup__shell-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 40px;
  }

  .velzo-startup__shell-header .velzo-startup__placeholder:first-child {
    width: 96px;
    height: 24px;
  }

  .velzo-startup__shell-header .velzo-startup__placeholder:last-child {
    width: 32px;
    height: 32px;
    border-radius: 50%;
  }

  .velzo-startup__shell-search {
    height: 42px;
    margin-block: 14px;
  }

  .velzo-startup__shell-categories,
  .velzo-startup__shell-cards,

    display: grid;
    gap: 12px;
  }

  .velzo-startup__shell-categories { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .velzo-startup__shell-categories .velzo-startup__placeholder { height: clamp(28px, 12vw, 56px); }

  .velzo-startup__shell-heading {
    width: 128px;
    height: 16px;
    margin-bottom: 12px;
  }

  .velzo-startup__shell-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .velzo-startup__shell-cards .velzo-startup__placeholder { height: clamp(40px, 15vh, 144px); }
  .velzo-startup__shell-cards .velzo-startup__placeholder:nth-child(n + 4) { display: none; }

  .velzo-startup__shell-nav {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    justify-items: center;
    border-top: 1px solid #edf1f7;
    margin-top: 16px;
    padding-block: 12px env(safe-area-inset-bottom);
  }

  .velzo-startup__shell-nav .velzo-startup__placeholder { width: 28px; height: 20px; }

  @media (min-width: 1024px) {
    .velzo-startup__shell { width: min(100% - 64px, 1440px); }
    .velzo-startup__shell-top, .velzo-startup__shell-bottom { padding: 24px 0; }
    .velzo-startup__shell-search { width: min(50%, 480px); margin-inline: auto; }
    .velzo-startup__shell-cards { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; }
    .velzo-startup__shell-cards .velzo-startup__placeholder:nth-child(n + 4) { display: block; }
    .velzo-startup__shell-nav { display: none; }

  @media (max-height: 520px) {
    .velzo-startup__shell-categories, .velzo-startup__shell-cards, .velzo-startup__shell-heading { display: none; }
  }

    display: block;
    width: 152px;
    height: 48px;
    object-fit: contain;
    animation: velzo-brand-in 180ms ease-out both;
  }

  .velzo-startup__dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }

  .velzo-startup__dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #0e50ed;
    animation: velzo-dot-pulse 900ms ease-in-out infinite alternate;
  }

  .velzo-startup__dots span:nth-child(2) { animation-delay: 150ms; }
  .velzo-startup__dots span:nth-child(3) { animation-delay: 300ms; }

  @keyframes velzo-brand-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes velzo-dot-pulse {
    from { opacity: 0.35; }
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .velzo-startup__brand, .velzo-startup__dots span { animation: none; }
